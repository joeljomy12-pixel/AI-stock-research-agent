services:
  - type: web
    name: stock-intelligence-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: CORS_ORIGINS_STR
        value: https://ai-stock-research-agent-7dixrl2ks-joeljomy12-1428s-projects.vercel.app
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 8000